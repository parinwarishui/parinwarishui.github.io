name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Freeze Flask app
        run: python freeze.py

      - name: Remove stale Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          run_id="${{ github.run_id }}"
          echo "Checking for existing github-pages artifacts in run $run_id"
          artifact_ids=$(gh api "/repos/${{ github.repository }}/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name=="github-pages") | .id')
          if [ -n "$artifact_ids" ]; then
            echo "$artifact_ids" | while read -r artifact_id; do
              [ -n "$artifact_id" ] || continue
              echo "Deleting stale artifact $artifact_id"
              gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
